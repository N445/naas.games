name: naas-games

services:
  naas-games-php:
    container_name: naas-games_php
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        APP_UID: ${APP_UID}
        APP_GID: ${APP_GID}
    image: naas-games-dev
    restart: unless-stopped
    user: ${APP_UID}:${APP_GID}
    environment:
      SERVER_NAME: ":8000"
      XDEBUG_MODE: ${XDEBUG_MODE}
    volumes:
      - ./:/app
    depends_on:
      database: { condition: service_healthy }
      vision: { condition: service_started }
    networks: [app, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      # Noms distincts de compose.prod.yaml : deux piles au même nom de service deviendraient un seul service Traefik.
      traefik.http.routers.naas-games-dev.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.naas-games-dev.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTP}
      traefik.http.routers.naas-games-dev-https.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.naas-games-dev-https.entrypoints: ${TRAEFIK_ENTRYPOINT_HTTPS}
      traefik.http.routers.naas-games-dev-https.tls: "true"
      traefik.http.services.naas-games-dev.loadbalancer.server.port: "8000"

  vision:
    container_name: naas-games_vision
    build: docker/vision
    image: naas-games-vision
    restart: unless-stopped
    volumes:
      - vision_models:/models
    networks: [app]

  database:
    container_name: naas-games_mariadb
    image: mariadb:10.5.29
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10
    networks: [app]

volumes:
  mariadb_data:
    name: naas-games_mariadb_data
  vision_models:
    name: naas-games_vision_models

networks:
  app:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
