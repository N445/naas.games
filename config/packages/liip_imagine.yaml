# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
  # valid drivers options include "gd" or "gmagick" or "imagick"
  driver: "imagick"

  twig:
    mode: lazy


  default_filter_set_settings:
    format: webp

  webp:
    generate: true

  loaders:
    screenshots:
      filesystem:
        data_root: '%app.screenshots_directory%'

  resolvers:
    default:
      web_path:
        web_root: '%kernel.project_dir%/public'
        cache_prefix: 'media/cache'

  filter_sets:
    main_logo:
      filters:
        fixed:
          width: 250
          height: 250
    photo_listing:
      filters:
        fixed:
          width: 320
          height: 420
    screenshot_thumbnail:
      data_loader: screenshots
      quality: 80
      filters:
        auto_rotate: ~
        thumbnail: { size: [480, 300], mode: outbound }
    screenshot_preview:
      data_loader: screenshots
      quality: 85
      filters:
        auto_rotate: ~
        thumbnail: { size: [1920, 1080], mode: inset }
    album_cover:
      data_loader: screenshots
      quality: 80
      filters:
        auto_rotate: ~
        thumbnail: { size: [800, 500], mode: outbound }
    ai_analysis:
      data_loader: screenshots
      format: jpg
      quality: 85
      filters:
        auto_rotate: ~
        thumbnail: { size: [1568, 1568], mode: inset }
